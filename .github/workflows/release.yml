name: Release

# Publishes a version when its tag is pushed (git tag -a v0.1.0 && git push origin v0.1.0).
# The tag must match pyproject.toml's version. Every CI job runs first; then the image is
# built for amd64 and arm64, pushed to ghcr.io/aiordanescu/ib-gateway-mcp as <version>,
# <major>.<minor>, latest and stable (a pre-release tag such as v0.2.0-rc.1 gets only its
# own version), attested, and pulled back for a smoke test on both platforms. The GitHub
# release takes its notes from the version's section of CHANGELOG.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish the image to ghcr.io
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # signs the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check that the tag matches the package version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile labels each platform's image; these annotations put the same
      # metadata on the multi-platform index, which is what ghcr.io reads to link the
      # package to this repository and show its description.
      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=stable,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pull the published image back and smoke test it on both platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            # Docker keeps one platform per digest reference: drop the previous one first.
            docker image rm -f "$IMAGE@$DIGEST" >/dev/null 2>&1 || true
            out=$(docker run --rm --pull always --platform "$platform" "$IMAGE@$DIGEST" --version)
            echo "$platform: $out"
            test "$out" = "ib-gateway-mcp $VERSION"
          done

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[)", changelog, re.M | re.S
          )
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY']}:{version}"
          notes = match.group(1).strip() + f"\n\nContainer image: `docker pull {image}`\n"
          pathlib.Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
